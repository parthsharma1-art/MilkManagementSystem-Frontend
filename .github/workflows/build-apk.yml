name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK Path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Downloadable APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/MilkManagementSystem.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MilkManagementSystem-APK
          path: release-apk/MilkManagementSystem.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Milk Management System v1.0.${{ github.run_number }}
          body: |
            ## 🥛 Milk Management System Android APK
            - **Filename:** `MilkManagementSystem.apk`
            - **Backend:** Connected to production Render API (`https://milkmanagementsystem.onrender.com/api`)
            
            ### Quick Installation:
            1. Download `MilkManagementSystem.apk` directly to your Android smartphone.
            2. Enable "Allow from this source" if your phone asks for installation permissions.
            3. Tap **Install** and open the app!
          files: release-apk/MilkManagementSystem.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

